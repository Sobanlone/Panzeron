<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="panzeron-token" content="__SESSION_TOKEN__">
<meta name="color-scheme" content="dark light">
<title>Panzeron</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-boot.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <!-- liquid-glass lens: a slow, soft displacement bends whatever sits behind the glass (Chromium/WebView2) -->
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.008" numOctaves="2" seed="11" result="n"/>
    <feGaussianBlur in="n" stdDeviation="3" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div id="boot" aria-hidden="true">
  <div class="boot-half l"></div><div class="boot-half r"></div>
  <canvas class="boot-rain" aria-hidden="true"></canvas>
  <div class="boot-beam"></div>
  <div class="boot-core">
    <div class="boot-orb">
      <canvas class="bo-cv back" aria-hidden="true"></canvas>
      <svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="46"/><circle class="ring2" cx="50" cy="50" r="38"/></svg>
      <i class="shock"></i><i class="shock s2"></i><b class="ball"></b>
      <canvas class="bo-cv front" aria-hidden="true"></canvas>
      <!-- the plain CSS dragon below is only the fallback; js/matrix-dragon.js draws the 3D code dragon on the canvases and hides it -->
      <div class="boot-orbit"><div class="bo-x"><div class="bo-y"><div class="bo-turn">
        <span class="bo-glow"><i class="bo-dragon"></i></span><i class="bo-dragon"></i>
      </div></div></div></div>
    </div>
    <div class="boot-word"><span>P</span><span>A</span><span>N</span><span>Z</span><span>E</span><span>R</span><span>O</span><span>N</span></div>
    <div class="boot-sub">Protect the person</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-status" id="boot-status">Starting local engine…</div>
  </div>
</div>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i></div>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Panzeron</b><small>Protect the person</small></div></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main>
    <header class="top"><div class="titlewrap"><h1 id="title"></h1><div id="tagline"></div></div><div class="top-actions"><div id="topright"></div><button id="theme" class="icon" type="button" aria-label="Switch between dark and light" title="Switch between dark and light"></button></div></header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
